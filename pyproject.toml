[project]
name = "alloy-field"
version = "0.1.0"
description = "Solidification Dendrite Cellular Automata, CET, and Texture Generation Engine for ICME"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
